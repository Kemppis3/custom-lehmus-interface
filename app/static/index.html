<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lehmus Chat</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <button id="new-chat" class="primary">+ New chat</button>
      <button id="close-sidebar" class="icon-btn mobile-only" aria-label="Close sidebar">✕</button>
    </div>
    <input id="search" type="search" placeholder="Search chats…" autocomplete="off">
    <nav id="conv-list" aria-label="Conversations"></nav>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="open-sidebar" class="icon-btn mobile-only" aria-label="Open sidebar">☰</button>
      <label class="model-pick">
        <span>Model</span>
        <select id="model-select"></select>
      </label>
      <span id="model-badge" class="badge" hidden>🖼 vision</span>
      <button id="refresh-models" class="icon-btn" title="Refresh model list" aria-label="Refresh model list">⟳</button>
    </header>

    <div id="notice" hidden></div>

    <section id="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h1>Lehmus Chat</h1>
        <p>Pick a model above and start typing. You can attach images, PDFs, Word documents and text or code files.</p>
      </div>
    </section>

    <form id="composer">
      <div id="attach-list"></div>
      <div class="composer-row">
        <label class="icon-btn attach" title="Attach files" aria-label="Attach files">
          📎<input id="file-input" type="file" multiple hidden>
        </label>
        <textarea id="input" rows="1" placeholder="Message the model…  (Enter to send, Shift+Enter for new line)"></textarea>
        <button id="send" type="submit" class="primary">Send</button>
        <button id="stop" type="button" class="danger" hidden>Stop</button>
      </div>
    </form>
  </main>

  <div id="drop-overlay" hidden>Drop files to attach</div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
