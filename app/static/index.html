<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lehmus Chat</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <button id="new-chat" class="primary">+ Uusi keskustelu</button>
      <button id="close-sidebar" class="icon-btn mobile-only" aria-label="Sulje sivupalkki">✕</button>
    </div>
    <input id="search" type="search" placeholder="Hae keskusteluista…" autocomplete="off">
    <nav id="conv-list" aria-label="Keskustelut"></nav>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="open-sidebar" class="icon-btn mobile-only" aria-label="Avaa sivupalkki">☰</button>
      <label class="model-pick">
        <span>Malli</span>
        <select id="model-select"></select>
      </label>
      <span id="model-badge" class="badge" hidden>🖼 kuvat</span>
      <button id="refresh-models" class="icon-btn" title="Päivitä malliluettelo" aria-label="Päivitä malliluettelo">⟳</button>
    </header>

    <div id="notice" hidden></div>

    <section id="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h1>Lehmus Chat</h1>
        <p>Valitse malli yläpalkista ja kirjoita viesti. Voit liittää kuvia, PDF- ja Word-tiedostoja sekä teksti- ja kooditiedostoja.</p>
      </div>
    </section>

    <form id="composer">
      <div id="attach-list"></div>
      <div class="composer-row">
        <label class="icon-btn attach" title="Liitä tiedostoja" aria-label="Liitä tiedostoja">
          📎<input id="file-input" type="file" multiple hidden>
        </label>
        <textarea id="input" rows="1" placeholder="Kirjoita viesti…  (Enter lähettää, Shift+Enter rivinvaihto)"></textarea>
        <button id="send" type="submit" class="primary">Lähetä</button>
        <button id="stop" type="button" class="danger" hidden>Pysäytä</button>
      </div>
    </form>
  </main>

  <div id="drop-overlay" hidden>Pudota tiedostot liitteeksi</div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
